<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Bird Clone</title>
  <style>
    * { margin: 0; padding: 0; }
    canvas { display: block; background: #70c5ce; }
  </style>
</head>
<body>
<canvas id="game" width="320" height="480"></canvas>
<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const GRAVITY = 0.5;
  const FLAP = -8;
  const PIPE_WIDTH = 50;
  const PIPE_GAP = 120;
  const BIRD_RADIUS = 12;

  let birdY = canvas.height / 2;
  let birdVY = 0;
  let score = 0;
  let pipes = [];
  let gameOver = false;

  function resetGame() {
    birdY = canvas.height / 2;
    birdVY = 0;
    score = 0;
    pipes = [];
    gameOver = false;
  }

  function drawBird() {
    ctx.fillStyle = "#fce205"; // Flappy yellow
    ctx.beginPath();
    ctx.arc(80, birdY, BIRD_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPipes() {
    ctx.fillStyle = "#3ec300"; // Pipe green
    pipes.forEach(pipe => {
      // Top pipe
      ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.top);
      // Bottom pipe
      ctx.fillRect(pipe.x, pipe.top + PIPE_GAP, PIPE_WIDTH, canvas.height - pipe.top - PIPE_GAP);
    });
  }

  function drawScore() {
    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText("Score: " + score, 10, 30);
  }

  function flap() {
    if (!gameOver) birdVY = FLAP;
    else resetGame();
  }

  function update() {
    if (gameOver) return;

    birdVY += GRAVITY;
    birdY += birdVY;

    // Add pipes
    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 150) {
      const top = Math.random() * (canvas.height - PIPE_GAP - 100) + 20;
      pipes.push({ x: canvas.width, top });
    }

    // Move pipes
    pipes.forEach(pipe => pipe.x -= 2);

    // Remove off-screen pipes
    if (pipes[0].x + PIPE_WIDTH < 0) {
      pipes.shift();
      score++;
    }

    // Collision detection
    if (birdY + BIRD_RADIUS > canvas.height || birdY - BIRD_RADIUS < 0) {
      gameOver = true;
    }

    pipes.forEach(pipe => {
      if (
        80 + BIRD_RADIUS > pipe.x &&
        80 - BIRD_RADIUS < pipe.x + PIPE_WIDTH &&
        (birdY - BIRD_RADIUS < pipe.top || birdY + BIRD_RADIUS > pipe.top + PIPE_GAP)
      ) {
        gameOver = true;
      }
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawPipes();
    drawBird();
    drawScore();

    if (gameOver) {
      ctx.fillStyle = "black";
      ctx.font = "30px Arial";
      ctx.fillText("💀 Game Over", 80, canvas.height / 2);
      ctx.font = "16px Arial";
      ctx.fillText("Press space to restart", 75, canvas.height / 2 + 30);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", e => {
    if (e.code === "Space") flap();
  });

  document.addEventListener("mousedown", flap);

  loop();
</script>
</body>
</html>
